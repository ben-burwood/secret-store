services:
  secret-store:
    container_name: secret-store
    build: .
    ports:
      - 8080:8080
    environment:
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-admin}
      - ENCRYPTION_KEY # openssl rand -hex 16
    volumes:
      - secret-store-data:/data

volumes:
  secret-store-data:
